name: Sync install repositories

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-install-repositories
  cancel-in-progress: false

jobs:
  cache-guard:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.CACHE_GUARD_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/cache_guard_deploy
          chmod 600 ~/.ssh/cache_guard_deploy
          curl --fail --silent --show-error https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' > ~/.ssh/known_hosts
      - name: Publish plugin subtree
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/cache_guard_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          commit=$(git subtree split --prefix=plugins/magpie-cache-guard HEAD)
          git push git@github.com:x-mug/magpie-cache-guard.git "$commit:refs/heads/main"
          printf 'Published `%s` from source `%s`.\n' "$commit" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deployment SSH key
        if: always()
        run: rm -f ~/.ssh/cache_guard_deploy
      - name: Build installable package
        run: |
          mkdir -p dist
          ( cd plugins/magpie-cache-guard && npm pack --ignore-scripts --pack-destination ../../dist )
          node scripts/check-packages.mjs
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./plugins/magpie-cache-guard/package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Tag `%s` already exists, release skipped.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          {
            printf '安装或更新：在 Magpie 的 Plugins → 添加插件中输入 `github:x-mug/magpie-cache-guard`，或执行 `magpie plugin add github:x-mug/magpie-cache-guard`；固定版本用 `github:x-mug/magpie-cache-guard#%s`。\n\n' "$tag"
            printf '离线安装包 `magpie-cache-guard-%s.tgz` 需先解压到固定目录，再添加其中 `package` 文件夹的绝对路径；`SHA256SUMS.txt` 是校验和。\n\n' "$version"
            if [ -n "$previous" ]; then
              printf '本版本变更（`%s..%s`）：\n\n' "$previous" "$(git rev-parse --short HEAD)"
              git log --pretty='- %s' "$previous..HEAD"
            fi
          } > release-notes.md
          gh release create "$tag" dist/*.tgz dist/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "Magpie 插件合集 $tag" \
            --notes-file release-notes.md
          printf 'Published source release `%s`.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
