name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Tag `%s` already exists, release skipped.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          node -e "const fs=require('fs'),c=require('crypto'),d='dist';const f=fs.readdirSync(d).find(n=>n.endsWith('.tgz'));fs.writeFileSync(d+'/SHA256SUMS.txt',c.createHash('sha256').update(fs.readFileSync(d+'/'+f)).digest('hex')+'  '+f+'\n')"
          {
            printf '安装或更新：在 Magpie 的 Plugins → 添加插件中输入 `github:x-mug/magpie-cache-guard`，或执行 `magpie plugin add github:x-mug/magpie-cache-guard`；固定版本用 `github:x-mug/magpie-cache-guard#%s`。\n\n' "$tag"
            printf '离线安装包 `magpie-cache-guard-%s.tgz` 需先解压到固定目录，再添加其中 `package` 文件夹的绝对路径；`SHA256SUMS.txt` 是校验和。\n\n' "$version"
            printf '源码与变更说明见 [magpie-plugins %s](https://github.com/x-mug/magpie-plugins/releases/tag/%s)。\n' "$tag" "$tag"
          } > release-notes.md
          gh release create "$tag" dist/*.tgz dist/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "缓存看守 $tag" \
            --notes-file release-notes.md
          printf 'Published `%s`.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
